<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Leon S. Kennedy — Rutina</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --card: #222;
            --border: #333;
            --accent: #e63946;
            --accent2: #ff6b6b;
            --text: #f0f0f0;
            --muted: #888;
            --green: #2ecc71;
            --input-bg: #2a2a2a;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100dvh;
            padding-bottom: 32px;
        }

        /* ── HEADER ── */
        header {
            background: linear-gradient(135deg, #1a0000 0%, #2d0000 50%, #1a0000 100%);
            border-bottom: 2px solid var(--accent);
            padding: 20px 16px 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(230, 57, 70, 0.5);
        }

        header p {
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* ── TABS ── */
        .tabs {
            display: flex;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 73px;
            z-index: 99;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 8px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            position: relative;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-btn .badge {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            font-size: 0.62rem;
            font-weight: 700;
            border-radius: 20px;
            padding: 1px 5px;
            margin-left: 4px;
            vertical-align: middle;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .tab-btn .badge.visible {
            opacity: 1;
        }

        /* ── DAY PANEL ── */
        .day-panel {
            display: none;
            padding: 16px 12px;
            animation: fadeIn 0.25s ease;
        }

        .day-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── PROGRESS BAR ── */
        .progress-wrap {
            background: var(--surface);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .progress-label span:last-child {
            color: var(--accent);
            font-weight: 700;
        }

        .progress-bar {
            background: var(--border);
            border-radius: 99px;
            height: 6px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            height: 100%;
            border-radius: 99px;
            transition: width 0.4s ease;
        }

        /* ── EXERCISE CARD ── */
        .exercise-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 10px;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .exercise-card.done {
            border-color: var(--green);
            box-shadow: 0 0 12px rgba(46, 204, 113, 0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 14px 10px;
        }

        /* Checkbox */
        .check-wrap {
            flex-shrink: 0;
        }

        .check-wrap input[type="checkbox"] {
            display: none;
        }

        .check-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .check-circle svg {
            opacity: 0;
            transition: opacity 0.2s;
            stroke: #fff;
        }

        .check-wrap input:checked~.check-circle {
            background: var(--green);
            border-color: var(--green);
        }

        .check-wrap input:checked~.check-circle svg {
            opacity: 1;
        }

        .exercise-name {
            flex: 1;
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.25;
            transition: color 0.2s;
        }

        .exercise-card.done .exercise-name {
            color: var(--green);
            text-decoration: line-through;
            text-decoration-color: rgba(46, 204, 113, 0.5);
        }

        /* Edit icon */
        .edit-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            flex-shrink: 0;
        }

        .edit-btn:hover,
        .edit-btn.open {
            color: var(--accent);
            background: rgba(230, 57, 70, 0.1);
        }

        /* Fields row */
        .card-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 0 14px 14px;
        }

        .field-group {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            position: relative;
            transition: border-color 0.2s;
        }

        .field-group:focus-within {
            border-color: var(--accent);
        }

        .field-label {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 3px;
        }

        .field-value {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text);
            display: block;
            width: 100%;
        }

        /* Inline editable input */
        .field-input {
            background: none;
            border: none;
            outline: none;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--accent2);
            width: 100%;
            font-family: inherit;
            display: none;
        }

        .field-group.editing .field-value {
            display: none;
        }

        .field-group.editing .field-input {
            display: block;
        }

        /* NULL / empty state */
        .field-value.empty {
            color: var(--muted);
            font-style: italic;
            font-weight: 400;
        }

        /* Edit controls */
        .card-edit-bar {
            display: none;
            padding: 0 14px 12px;
            gap: 8px;
        }

        .card-edit-bar.open {
            display: flex;
        }

        .edit-bar-btn {
            flex: 1;
            padding: 9px;
            border-radius: 8px;
            border: none;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: opacity 0.15s;
        }

        .edit-bar-btn:active {
            opacity: 0.75;
        }

        .btn-save {
            background: var(--accent);
            color: #fff;
        }

        .btn-cancel {
            background: var(--border);
            color: var(--text);
        }

        /* ── NAME INPUT ── */
        .name-input {
            flex: 1;
            background: none;
            border: none;
            border-bottom: 1px solid var(--accent);
            outline: none;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent2);
            font-family: inherit;
            display: none;
            min-width: 0;
            padding: 0;
        }

        .exercise-card.editing .exercise-name { display: none; }
        .exercise-card.editing .name-input { display: block; }

        /* ── SPINNER ── */
        .spinner-wrap {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 60px 0;
        }

        .spinner-wrap.visible { display: flex; }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── FINISH DAY BTN ── */
        .finish-day-wrap {
            display: none;
            margin-bottom: 8px;
        }

        .finish-day-wrap.visible { display: block; }

        .finish-day-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: var(--green);
            color: #fff;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(46, 204, 113, 0.3);
        }

        .finish-day-btn:hover { opacity: 0.88; }
        .finish-day-btn:active { transform: scale(0.98); }

        /* ── HEADER TIMER BTN ── */
        .header-timer-btn {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            transition: color 0.2s;
        }

        .header-timer-btn:hover { color: var(--accent); }
        .header-timer-btn.running { color: var(--accent); }

        /* ── TIMER ── */

        .timer-body {
            display: none;
        }

        .timer-body.open {
            display: flex;
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            padding: 32px 24px;
            animation: fadeIn 0.2s ease;
        }

        .timer-close-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            line-height: 1;
            transition: color 0.2s;
        }

        .timer-close-btn:hover { color: var(--text); }

        .timer-display {
            font-size: 7rem;
            font-weight: 800;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.04em;
            color: var(--text);
            transition: color 0.3s;
            line-height: 1;
        }

        .timer-display.running { color: var(--accent); }
        .timer-display.done { color: var(--green); }

        .timer-presets {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .timer-preset-btn {
            flex: 1;
            padding: 12px 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: none;
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .timer-preset-btn:hover,
        .timer-preset-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(230,57,70,0.08);
        }

        .timer-custom-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .timer-custom-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .timer-custom-input:focus { border-color: var(--accent); }
        .timer-custom-input::placeholder { color: var(--muted); }

        .timer-controls {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .timer-start-btn {
            flex: 2;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .timer-start-btn:hover { opacity: 0.85; }

        .timer-reset-btn {
            flex: 1;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: none;
            color: var(--muted);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .timer-reset-btn:hover { border-color: var(--muted); color: var(--text); }

        /* ── UTILITY BAR ── */
        .utility-bar {
            padding: 20px 12px 24px;
            border-top: 1px solid var(--border);
            margin-top: 8px;
        }

        .util-btn {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: 1px solid rgba(230, 126, 34, 0.25);
            background: rgba(230, 126, 34, 0.04);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--muted);
        }

        .util-btn-origin:hover {
            border-color: #e67e22;
            color: #e67e22;
            background: rgba(230, 126, 34, 0.1);
        }

        /* ── SEARCH / DELETE ── */
        .search-btn {
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            flex-shrink: 0;
            text-decoration: none;
        }

        .search-btn:hover { color: #4285f4; background: rgba(66,133,244,0.1); }

        .delete-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            flex-shrink: 0;
        }

        .delete-btn:hover { color: var(--accent); background: rgba(230,57,70,0.1); }

        /* ── ADD FORM ── */
        .add-form {
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 10px;
            flex-direction: column;
            gap: 10px;
            animation: fadeIn 0.2s ease;
        }

        .add-form.open { display: flex; }

        .add-form-fields { display: flex; flex-direction: column; gap: 8px; }

        .add-input {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 0.88rem;
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .add-input:focus { border-color: var(--accent); }
        .add-input::placeholder { color: var(--muted); }

        .add-form-btns { display: flex; gap: 8px; }

        .add-exercise-wrap { text-align: center; margin-bottom: 8px; }

        .add-exercise-btn {
            background: none;
            border: 1px dashed var(--border);
            color: var(--muted);
            font-size: 0.75rem;
            padding: 9px;
            border-radius: 10px;
            cursor: pointer;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: all 0.2s;
            width: 100%;
        }

        .add-exercise-btn:hover { border-color: var(--green); color: var(--green); }

        /* ── RESET ALL ── */
        .reset-wrap {
            margin-top: 10px;
        }

        .reset-btn {
            width: 100%;
            background: rgba(230, 57, 70, 0.05);
            border: 1px solid rgba(230, 57, 70, 0.2);
            color: var(--muted);
            font-size: 0.78rem;
            padding: 11px;
            border-radius: 10px;
            cursor: pointer;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            font-weight: 700;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(230, 57, 70, 0.1);
        }

        /* ── SAVE INDICATOR ── */
        .save-indicator {
            position: fixed;
            top: 80px;
            right: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 12px 5px 8px;
            font-size: 0.72rem;
            color: var(--muted);
            display: none;
            align-items: center;
            gap: 7px;
            z-index: 150;
        }

        .save-indicator.visible { display: flex; }

        .save-mini-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #222;
            border: 1px solid var(--green);
            color: var(--green);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 99px;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            white-space: nowrap;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

    <header>
        <h1>Leon S. Kennedy</h1>
        <p>Plan de Entrenamiento</p>
        <button class="header-timer-btn" id="header-timer-btn" onclick="toggleTimerSection()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="header-timer-time">1:00</span>
        </button>
    </header>

    <div class="tabs" role="tablist">
        <button class="tab-btn active" data-day="1" role="tab">Día 1<span class="badge" id="badge-1"></span></button>
        <button class="tab-btn" data-day="2" role="tab">Día 2<span class="badge" id="badge-2"></span></button>
        <button class="tab-btn" data-day="3" role="tab">Día 3<span class="badge" id="badge-3"></span></button>
    </div>

    <div class="spinner-wrap" id="spinner"><div class="spinner"></div></div>

    <div class="timer-body" id="timer-body">
        <button class="timer-close-btn" onclick="toggleTimerSection()">✕</button>
        <div class="timer-display" id="timer-display">1:00</div>
        <div class="timer-presets">
            <button class="timer-preset-btn" onclick="setTimer(30)">30s</button>
            <button class="timer-preset-btn" onclick="setTimer(40)">40s</button>
            <button class="timer-preset-btn" onclick="setTimer(60)">1m</button>
            <button class="timer-preset-btn" onclick="setTimer(120)">2m</button>
        </div>
        <div class="timer-custom-row">
            <input class="timer-custom-input" id="timer-custom-input" type="number" min="5" max="600" placeholder="Segundos personalizados">
            <button class="timer-preset-btn" onclick="setCustomTimer()" style="flex:0;padding:8px 14px">Set</button>
        </div>
        <div class="timer-controls">
            <button class="timer-start-btn" id="timer-start-btn" onclick="startPauseTimer()">Iniciar</button>
            <button class="timer-reset-btn" onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <div class="day-panel active" id="day-1">
        <div class="progress-wrap">
            <div class="progress-label"><span>Progreso</span><span id="prog-label-1">0 / 0</span></div>
            <div class="progress-bar">
                <div class="progress-fill" id="prog-fill-1" style="width:0%"></div>
            </div>
        </div>
        <div id="exercises-1"></div>
        <div id="add-form-1" class="add-form">
            <div class="add-form-fields">
                <input class="add-input add-nombre" type="text" placeholder="Nombre del ejercicio">
                <input class="add-input add-series" type="text" placeholder="Series / Reps (ej: 3 x 10-12)">
                <input class="add-input add-peso" type="text" placeholder="Peso (vacío = peso corporal)">
            </div>
            <div class="add-form-btns">
                <button class="edit-bar-btn btn-save" onclick="saveNewExercise(1)">Agregar</button>
                <button class="edit-bar-btn btn-cancel" onclick="cancelAddForm(1)">Cancelar</button>
            </div>
        </div>
        <div class="add-exercise-wrap">
            <button class="add-exercise-btn" onclick="showAddForm(1)">+ Agregar ejercicio</button>
        </div>
        <div class="finish-day-wrap" id="finish-wrap-1">
            <button class="finish-day-btn" onclick="finishDay(1)">Finalizar día 1</button>
        </div>
        <div class="reset-wrap">
            <button class="reset-btn" onclick="resetDay(1)">Reiniciar día 1</button>
        </div>
    </div>

    <div class="day-panel" id="day-2">
        <div class="progress-wrap">
            <div class="progress-label"><span>Progreso</span><span id="prog-label-2">0 / 0</span></div>
            <div class="progress-bar">
                <div class="progress-fill" id="prog-fill-2" style="width:0%"></div>
            </div>
        </div>
        <div id="exercises-2"></div>
        <div id="add-form-2" class="add-form">
            <div class="add-form-fields">
                <input class="add-input add-nombre" type="text" placeholder="Nombre del ejercicio">
                <input class="add-input add-series" type="text" placeholder="Series / Reps (ej: 3 x 10-12)">
                <input class="add-input add-peso" type="text" placeholder="Peso (vacío = peso corporal)">
            </div>
            <div class="add-form-btns">
                <button class="edit-bar-btn btn-save" onclick="saveNewExercise(2)">Agregar</button>
                <button class="edit-bar-btn btn-cancel" onclick="cancelAddForm(2)">Cancelar</button>
            </div>
        </div>
        <div class="add-exercise-wrap">
            <button class="add-exercise-btn" onclick="showAddForm(2)">+ Agregar ejercicio</button>
        </div>
        <div class="finish-day-wrap" id="finish-wrap-2">
            <button class="finish-day-btn" onclick="finishDay(2)">Finalizar día 2</button>
        </div>
        <div class="reset-wrap">
            <button class="reset-btn" onclick="resetDay(2)">Reiniciar día 2</button>
        </div>
    </div>

    <div class="day-panel" id="day-3">
        <div class="progress-wrap">
            <div class="progress-label"><span>Progreso</span><span id="prog-label-3">0 / 0</span></div>
            <div class="progress-bar">
                <div class="progress-fill" id="prog-fill-3" style="width:0%"></div>
            </div>
        </div>
        <div id="exercises-3"></div>
        <div id="add-form-3" class="add-form">
            <div class="add-form-fields">
                <input class="add-input add-nombre" type="text" placeholder="Nombre del ejercicio">
                <input class="add-input add-series" type="text" placeholder="Series / Reps (ej: 3 x 10-12)">
                <input class="add-input add-peso" type="text" placeholder="Peso (vacío = peso corporal)">
            </div>
            <div class="add-form-btns">
                <button class="edit-bar-btn btn-save" onclick="saveNewExercise(3)">Agregar</button>
                <button class="edit-bar-btn btn-cancel" onclick="cancelAddForm(3)">Cancelar</button>
            </div>
        </div>
        <div class="add-exercise-wrap">
            <button class="add-exercise-btn" onclick="showAddForm(3)">+ Agregar ejercicio</button>
        </div>
        <div class="finish-day-wrap" id="finish-wrap-3">
            <button class="finish-day-btn" onclick="finishDay(3)">Finalizar día 3</button>
        </div>
        <div class="reset-wrap">
            <button class="reset-btn" onclick="resetDay(3)">Reiniciar día 3</button>
        </div>
    </div>

    <div class="utility-bar">
<button class="util-btn util-btn-origin" onclick="resetToOrigin()">Restaurar originales</button>
    </div>

    <div class="save-indicator" id="save-indicator">
        <div class="save-mini-spinner"></div>
        <span>Guardando…</span>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const STORE_KEY = 'lsk_rutina_v2';
        let TOTALS = { 1: 0, 2: 0, 3: 0 };

        /* ── LOAD DATA ── */
        function showSpinner() {
            document.getElementById('spinner').classList.add('visible');
            document.querySelectorAll('.day-panel').forEach(p => p.style.display = 'none');
        }

        function hideSpinner() {
            document.getElementById('spinner').classList.remove('visible');
            document.querySelectorAll('.day-panel').forEach(p => p.style.display = '');
        }

        async function fetchAndRenderData(csvFallback = './data.csv') {
            showSpinner();
            try {
                const fbResp = await fetch(`${FIREBASE_URL}/rutina.json`);
                if (fbResp.ok) {
                    const fbData = await fbResp.json();
                    if (fbData && fbData.exercises && fbData.exercises.length > 0) {
                        renderExercisesFromArray(fbData.exercises);
                        init();
                        return;
                    }
                }
                // Firebase vacío → cargar CSV y subirlo
                const csvResp = await fetch(csvFallback);
                if (!csvResp.ok) throw new Error('No se encontró ' + csvFallback);
                renderExercises(await csvResp.text());
                init();
                await saveToFirebase();
            } catch (error) {
                console.error("Error cargando rutina:", error);
                showToast("Error cargando rutina.");
            } finally {
                hideSpinner();
            }
        }

        function renderExercisesFromArray(exercises) {
            document.getElementById('exercises-1').innerHTML = '';
            document.getElementById('exercises-2').innerHTML = '';
            document.getElementById('exercises-3').innerHTML = '';
            TOTALS = { 1: 0, 2: 0, 3: 0 };
            exercises.forEach(ex => {
                const dia = parseInt(ex.dia);
                const container = document.getElementById('exercises-' + dia);
                if (!container) return;
                TOTALS[dia]++;
                container.insertAdjacentHTML('beforeend', createCardHTML(ex.id, ex.nombre, ex.series, ex.peso));
            });
        }

        function createCardHTML(id, nombre, series, peso) {
            const pesoClase = peso ? '' : 'empty';
            const pesoMostrar = peso ? peso : '— Peso corporal —';
            const searchUrl = 'https://www.google.com/search?q=' + encodeURIComponent(nombre + ' ejercicio como hacer');
            return `
      <div class="exercise-card" data-id="${id}">
        <div class="card-header">
          <label class="check-wrap">
            <input type="checkbox" onchange="toggleDone(this)">
            <div class="check-circle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
          </label>
          <span class="exercise-name">${nombre}</span>
          <input class="name-input" type="text" value="${nombre}">
          <a class="search-btn" href="${searchUrl}" target="_blank" rel="noopener" title="Buscar en Google">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </a>
          <button class="edit-btn" onclick="toggleEdit(this)" title="Editar">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="delete-btn" onclick="deleteExercise(this)" title="Eliminar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
        <div class="card-fields">
          <div class="field-group"><div class="field-label">Series / Reps</div><div class="field-value">${series}</div><input class="field-input" type="text" value="${series}"></div>
          <div class="field-group"><div class="field-label">Peso</div><div class="field-value ${pesoClase}">${pesoMostrar}</div><input class="field-input" type="text" value="${peso}"></div>
        </div>
        <div class="card-edit-bar"><button class="edit-bar-btn btn-save" onclick="saveEdit(this)">Guardar</button><button class="edit-bar-btn btn-cancel" onclick="cancelEdit(this)">Cancelar</button></div>
      </div>
    `;
        }

        function renderExercises(csv) {
            document.getElementById('exercises-1').innerHTML = '';
            document.getElementById('exercises-2').innerHTML = '';
            document.getElementById('exercises-3').innerHTML = '';
            TOTALS = { 1: 0, 2: 0, 3: 0 };

            const lines = csv.split('\n').map(l => l.trim()).filter(l => l);
            lines.shift();

            const containers = {
                1: document.getElementById('exercises-1'),
                2: document.getElementById('exercises-2'),
                3: document.getElementById('exercises-3')
            };

            lines.forEach(line => {
                const parts = line.split(',');
                const dia = parseInt(parts[0]);
                const id = parts[1];
                const nombre = parts[2];
                const series = parts[3];
                const peso = parts[4] || '';
                if (!containers[dia]) return;
                TOTALS[dia]++;
                containers[dia].insertAdjacentHTML('beforeend', createCardHTML(id, nombre, series, peso));
            });
        }

        /* ── PERSISTENCE (solo done states) ── */
        function loadState() {
            try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
        }
        function saveState(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

        /* ── INIT ── */
        function init() {
            const state = loadState();

            // Solo restaurar checks (por dispositivo)
            document.querySelectorAll('.exercise-card').forEach(card => {
                const s = state[card.dataset.id];
                if (s && s.done) {
                    card.querySelector('input[type="checkbox"]').checked = true;
                    card.classList.add('done');
                }
            });

            // Restaurar última tab
            const lastTab = localStorage.getItem('lsk_last_tab');
            if (lastTab && document.getElementById('day-' + lastTab)) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.day-panel').forEach(p => p.classList.remove('active'));
                document.querySelector(`.tab-btn[data-day="${lastTab}"]`).classList.add('active');
                document.getElementById('day-' + lastTab).classList.add('active');
            }

            [1, 2, 3].forEach(d => { updateProgress(d); sortDay(d); });
        }

        function updateField(fg, val) {
            const disp = fg.querySelector('.field-value');
            const inp = fg.querySelector('.field-input');
            inp.value = val;
            if (val.trim() === '') {
                disp.textContent = '— Peso corporal —';
                disp.classList.add('empty');
            } else {
                disp.textContent = val;
                disp.classList.remove('empty');
            }
        }

        /* ── TABS ── */
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.day-panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('day-' + btn.dataset.day).classList.add('active');
                localStorage.setItem('lsk_last_tab', btn.dataset.day);
            });
        });

        /* ── DONE TOGGLE ── */
        function toggleDone(cb) {
            const card = cb.closest('.exercise-card');
            const id = card.dataset.id;
            const day = parseInt(id.split('-')[0]);
            card.classList.toggle('done', cb.checked);
            const state = loadState();
            state[id] = state[id] || {};
            state[id].done = cb.checked;
            saveState(state);
            updateProgress(day);
            sortDay(day);
        }

        /* ── SORT ── */
        function getIdOrder(id) {
            const parts = id.split('-');
            if (parts[1] && parts[1].startsWith('a')) return 10000 + parseInt(parts[1].slice(1), 10);
            return parseInt(parts[1] || 0, 10);
        }

        function sortDay(day) {
            const container = document.getElementById('exercises-' + day);
            if (!container) return;
            const cards = [...container.querySelectorAll('.exercise-card')];
            cards.sort((a, b) => {
                const aDone = a.classList.contains('done') ? 1 : 0;
                const bDone = b.classList.contains('done') ? 1 : 0;
                if (aDone !== bDone) return aDone - bDone;
                return getIdOrder(a.dataset.id) - getIdOrder(b.dataset.id);
            });
            cards.forEach(c => container.appendChild(c));
        }

        /* ── PROGRESS ── */
        function updateProgress(day) {
            const cards = document.querySelectorAll(`#exercises-${day} .exercise-card`);
            const done = [...cards].filter(c => c.classList.contains('done')).length;
            const total = TOTALS[day] || 0;

            if (total === 0) return; // Evitar dividir entre cero si aún no carga

            const pct = Math.round((done / total) * 100);
            document.getElementById(`prog-fill-${day}`).style.width = pct + '%';
            document.getElementById(`prog-label-${day}`).textContent = `${done} / ${total}`;

            const badge = document.getElementById(`badge-${day}`);
            if (done > 0 && done < total) {
                badge.textContent = done;
                badge.classList.add('visible');
            } else if (done === total) {
                badge.textContent = '✓';
                badge.classList.add('visible');
            } else {
                badge.classList.remove('visible');
            }

            const finishWrap = document.getElementById(`finish-wrap-${day}`);
            if (finishWrap) finishWrap.classList.toggle('visible', done >= 1);
        }

        /* ── EDIT ── */
        function toggleEdit(btn) {
            const card = btn.closest('.exercise-card');
            const editBar = card.querySelector('.card-edit-bar');
            const isOpen = editBar.classList.contains('open');

            if (isOpen) {
                cancelEdit(editBar.querySelector('.btn-cancel'));
                return;
            }
            btn.classList.add('open');
            editBar.classList.add('open');
            card.classList.add('editing');
            card.querySelectorAll('.field-group').forEach(fg => fg.classList.add('editing'));
            card.querySelector('.name-input').focus();
        }

        function saveEdit(saveBtn) {
            const card = saveBtn.closest('.exercise-card');
            const id = card.dataset.id;
            const fields = card.querySelectorAll('.field-group');
            const reps = fields[0].querySelector('.field-input').value.trim();
            const peso = fields[1].querySelector('.field-input').value.trim();

            const nameInput = card.querySelector('.name-input');
            const nombre = nameInput.value.trim() || card.querySelector('.exercise-name').textContent;

            updateField(fields[0], reps);
            updateField(fields[1], peso);
            card.querySelector('.exercise-name').textContent = nombre;
            nameInput.value = nombre;
            closeEditBar(card);

            saveToFirebase();
        }

        function cancelEdit(cancelBtn) {
            const card = cancelBtn.closest('.exercise-card');
            const fields = card.querySelectorAll('.field-group');
            fields.forEach(fg => {
                const disp = fg.querySelector('.field-value');
                const inp = fg.querySelector('.field-input');
                inp.value = disp.classList.contains('empty') ? '' : disp.textContent;
            });
            const nameInput = card.querySelector('.name-input');
            nameInput.value = card.querySelector('.exercise-name').textContent;
            closeEditBar(card);
        }

        function closeEditBar(card) {
            card.querySelector('.card-edit-bar').classList.remove('open');
            card.querySelector('.edit-btn').classList.remove('open');
            card.querySelectorAll('.field-group').forEach(fg => fg.classList.remove('editing'));
            card.classList.remove('editing');
        }

        /* ── RESET ── */
        function resetDay(day) {
            const cards = document.querySelectorAll(`#exercises-${day} .exercise-card`);
            const state = loadState();
            cards.forEach(card => {
                card.classList.remove('done');
                card.querySelector('input[type="checkbox"]').checked = false;
                const id = card.dataset.id;
                if (state[id]) state[id].done = false;
            });
            saveState(state);
            updateProgress(day);
            sortDay(day);
            showToast('Día ' + day + ' reiniciado');
        }

        function showSaveIndicator() { document.getElementById('save-indicator').classList.add('visible'); }
        function hideSaveIndicator() { document.getElementById('save-indicator').classList.remove('visible'); }

        /* ── TOAST ── */
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        /* ── EXPORT CSV ── */
        function generateCSVContent() {
            const rows = [['Dia', 'ID', 'Ejercicio', 'Series_Reps', 'Peso']];
            document.querySelectorAll('.exercise-card').forEach(card => {
                const id = card.dataset.id;
                const dia = id.split('-')[0];
                const nombre = card.querySelector('.exercise-name').textContent;
                const fields = card.querySelectorAll('.field-group');
                const series = fields[0].querySelector('.field-value').textContent;
                const pesoEl = fields[1].querySelector('.field-value');
                const peso = pesoEl.classList.contains('empty') ? '' : pesoEl.textContent;
                rows.push([dia, id, nombre, series, peso]);
            });
            return rows.map(r => r.join(',')).join('\n');
        }

        function exportCSV() {
            const csv = generateCSVContent();
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'data.csv';
            a.click();
            URL.revokeObjectURL(a.href);
            showToast('data.csv descargado');
        }

        /* ── FIREBASE SYNC ── */
        const FIREBASE_URL = 'https://leon-kennedy-workout-default-rtdb.firebaseio.com';

        async function saveToFirebase() {
            const exercises = [];
            document.querySelectorAll('.exercise-card').forEach(card => {
                const id = card.dataset.id;
                const dia = id.split('-')[0];
                const nombre = card.querySelector('.exercise-name').textContent;
                const fields = card.querySelectorAll('.field-group');
                const seriesEl = fields[0].querySelector('.field-value');
                const pesoEl = fields[1].querySelector('.field-value');
                const series = seriesEl.textContent;
                const peso = pesoEl.classList.contains('empty') ? '' : pesoEl.textContent;
                exercises.push({ dia, id, nombre, series, peso });
            });
            showSaveIndicator();
            try {
                const r = await fetch(`${FIREBASE_URL}/rutina.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ exercises })
                });
                if (!r.ok) throw new Error(r.status);
                showToast('Guardado ✓');
            } catch (err) {
                showToast('Error al guardar: ' + err.message);
            } finally {
                hideSaveIndicator();
            }
        }

        /* ── DELETE EXERCISE ── */
        function deleteExercise(btn) {
            if (!confirm('¿Eliminar este ejercicio?')) return;
            const card = btn.closest('.exercise-card');
            const id = card.dataset.id;
            const dia = parseInt(id.split('-')[0]);

            const state = loadState();
            delete state[id];
            saveState(state);

            TOTALS[dia] = Math.max(0, (TOTALS[dia] || 0) - 1);
            card.remove();
            updateProgress(dia);
            saveToFirebase();
        }

        /* ── ADD EXERCISE ── */
        function showAddForm(day) {
            const form = document.getElementById('add-form-' + day);
            const isOpen = form.classList.contains('open');
            form.classList.toggle('open');
            if (!isOpen) form.querySelector('.add-nombre').focus();
        }

        function saveNewExercise(day) {
            const form = document.getElementById('add-form-' + day);
            const nombre = form.querySelector('.add-nombre').value.trim();
            if (!nombre) { showToast('El nombre es requerido'); return; }
            const series = form.querySelector('.add-series').value.trim() || '—';
            const peso = form.querySelector('.add-peso').value.trim();

            const id = `${day}-a${Date.now()}`;
            const container = document.getElementById('exercises-' + day);
            container.insertAdjacentHTML('beforeend', createCardHTML(id, nombre, series, peso));
            TOTALS[day] = (TOTALS[day] || 0) + 1;

            form.querySelector('.add-nombre').value = '';
            form.querySelector('.add-series').value = '';
            form.querySelector('.add-peso').value = '';
            form.classList.remove('open');

            updateProgress(day);
            showToast('Ejercicio agregado');
            saveToFirebase();
        }

        function cancelAddForm(day) {
            const form = document.getElementById('add-form-' + day);
            form.querySelector('.add-nombre').value = '';
            form.querySelector('.add-series').value = '';
            form.querySelector('.add-peso').value = '';
            form.classList.remove('open');
        }

        /* ── RESET TO ORIGIN ── */
        async function resetToOrigin() {
            if (!confirm('¿Restaurar todos los ejercicios al estado original? Se perderán todos los cambios guardados.')) return;
            localStorage.removeItem(STORE_KEY);
            localStorage.removeItem('lsk_last_tab');
            const csvResp = await fetch('./data.csv');
            renderExercises(await csvResp.text());
            init();
            await saveToFirebase();
            showToast('Datos restaurados al original');
        }

        /* ── FINISH DAY + HISTORY ── */
        async function saveWorkoutHistory(day) {
            const done = [...document.querySelectorAll(`#exercises-${day} .exercise-card.done`)];
            if (!done.length) return;
            const ejercicios = done.map(card => {
                const fields = card.querySelectorAll('.field-group');
                const pesoEl = fields[1].querySelector('.field-value');
                return {
                    nombre: card.querySelector('.exercise-name').textContent,
                    series: fields[0].querySelector('.field-value').textContent,
                    peso: pesoEl.classList.contains('empty') ? 'Peso corporal' : pesoEl.textContent
                };
            });
            showSaveIndicator();
            try {
                await fetch(`${FIREBASE_URL}/historial.json`, {
                    method: 'POST',
                    body: JSON.stringify({
                        fecha: new Date().toLocaleDateString('es-MX', { year: 'numeric', month: '2-digit', day: '2-digit' }),
                        timestamp: Date.now(),
                        dia: day,
                        ejercicios
                    })
                });
            } finally {
                hideSaveIndicator();
            }
        }

        async function finishDay(day) {
            if (!confirm(`¿Finalizar día ${day}? Se guardará el progreso y se limpiarán los checks.`)) return;
            try {
                await saveWorkoutHistory(day);
                showToast(`Día ${day} guardado ✓`);
            } catch (err) {
                showToast('Error al guardar historial');
                return;
            }
            resetDay(day);
        }

        /* ── TIMER ── */
        function playTimerSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                [0, 0.18, 0.36].forEach(offset => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = 880;
                    gain.gain.setValueAtTime(0.6, ctx.currentTime + offset);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.15);
                    osc.start(ctx.currentTime + offset);
                    osc.stop(ctx.currentTime + offset + 0.15);
                });
            } catch (e) { /* sin soporte de audio */ }
        }

        const TIMER_CLIENT_ID = Math.random().toString(36).slice(2, 8);
        let timerDuration = parseInt(localStorage.getItem('lsk_timer_duration')) || 60;
        let timerRemaining = timerDuration;

        // Marcar preset activo según duración guardada
        (function() {
            const presets = [30, 40, 60, 120];
            document.querySelectorAll('.timer-preset-btn').forEach((b, i) => {
                b.classList.toggle('active', presets[i] === timerDuration);
            });
        })();
        let timerInterval = null;
        let timerRunning = false;
        let timerStartedAt = null;
        let timerEventSource = null;

        function toggleTimerSection() {
            document.getElementById('timer-body').classList.toggle('open');
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            return m > 0 ? `${m}:${String(s % 60).padStart(2, '0')}` : `${s}s`;
        }

        function updateTimerDisplay() {
            const text = formatTime(timerRemaining);
            document.getElementById('timer-display').textContent = text;
            document.getElementById('header-timer-time').textContent = text;
            const disp = document.getElementById('timer-display');
            disp.classList.toggle('running', timerRunning);
            disp.classList.toggle('done', !timerRunning && timerRemaining === 0);
            document.getElementById('header-timer-btn').classList.toggle('running', timerRunning);
            document.getElementById('timer-start-btn').textContent =
                timerRunning ? 'Pausar' : timerRemaining <= 0 ? 'Reiniciar' : 'Iniciar';
        }

        function pushTimerState(state) {
            fetch(`${FIREBASE_URL}/timer.json`, {
                method: 'PUT',
                body: JSON.stringify({ ...state, updatedBy: TIMER_CLIENT_ID })
            }).catch(() => {});
        }

        function applyTimerState(state) {
            if (!state) return;
            timerDuration = state.duration;
            clearInterval(timerInterval);
            timerRunning = state.running;
            timerStartedAt = state.startedAt || null;

            if (state.running && state.startedAt) {
                const elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
                timerRemaining = Math.max(0, state.remaining - elapsed);
                if (timerRemaining > 0) {
                    startLocalInterval(state.remaining, state.startedAt);
                } else {
                    timerRemaining = 0;
                    timerRunning = false;
                }
            } else {
                timerRemaining = state.remaining;
            }

            // Sincronizar botón de preset activo
            const presets = [30, 40, 60, 120];
            document.querySelectorAll('.timer-preset-btn').forEach((b, i) => {
                b.classList.toggle('active', presets[i] === state.duration);
            });

            updateTimerDisplay();
        }

        function startLocalInterval(snapRemaining, snapStartedAt) {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - snapStartedAt) / 1000);
                timerRemaining = Math.max(0, snapRemaining - elapsed);
                updateTimerDisplay();
                if (timerRemaining <= 0) {
                    clearInterval(timerInterval);
                    timerRunning = false;
                    updateTimerDisplay();
                    playTimerSound();
                    if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
                    pushTimerState({ duration: timerDuration, remaining: 0, startedAt: null, running: false });
                }
            }, 500);
        }

        function initTimerSync() {
            if (timerEventSource) timerEventSource.close();
            timerEventSource = new EventSource(`${FIREBASE_URL}/timer.json`);
            timerEventSource.addEventListener('put', e => {
                const msg = JSON.parse(e.data);
                const data = msg.data;
                if (!data || data.updatedBy === TIMER_CLIENT_ID) return;
                applyTimerState(data);
            });
        }

        function setTimer(seconds) {
            clearInterval(timerInterval);
            timerRunning = false;
            timerDuration = seconds;
            timerRemaining = seconds;
            timerStartedAt = null;
            localStorage.setItem('lsk_timer_duration', seconds);
            document.querySelectorAll('.timer-preset-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            updateTimerDisplay();
            pushTimerState({ duration: seconds, remaining: seconds, startedAt: null, running: false });
        }

        function setCustomTimer() {
            const val = parseInt(document.getElementById('timer-custom-input').value);
            if (!val || val < 1) return;
            clearInterval(timerInterval);
            timerRunning = false;
            timerDuration = val;
            timerRemaining = val;
            timerStartedAt = null;
            localStorage.setItem('lsk_timer_duration', val);
            document.querySelectorAll('.timer-preset-btn').forEach(b => b.classList.remove('active'));
            updateTimerDisplay();
            pushTimerState({ duration: val, remaining: val, startedAt: null, running: false });
        }

        function startPauseTimer() {
            if (timerRunning) {
                clearInterval(timerInterval);
                timerRunning = false;
                updateTimerDisplay();
                pushTimerState({ duration: timerDuration, remaining: timerRemaining, startedAt: null, running: false });
            } else {
                if (timerRemaining <= 0) timerRemaining = timerDuration;
                timerRunning = true;
                timerStartedAt = Date.now();
                startLocalInterval(timerRemaining, timerStartedAt);
                updateTimerDisplay();
                pushTimerState({ duration: timerDuration, remaining: timerRemaining, startedAt: timerStartedAt, running: true });
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerRunning = false;
            timerRemaining = timerDuration;
            timerStartedAt = null;
            updateTimerDisplay();
            pushTimerState({ duration: timerDuration, remaining: timerDuration, startedAt: null, running: false });
        }

        // INICIAR
        fetchAndRenderData();
        initTimerSync();
    </script>
</body>

</html>
